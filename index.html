<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mohammed Hasan - Learn Explore Improve</title>
    <!-- هنا يمكنك إضافة رابط ملف CSS القديم الخاص بك إذا كان موجوداً، أو لصق الـ CSS الكامل هنا -->
    <style>
        /* سأضع لك التصميم الأساسي المشابه لصورتك هنا. للحصول على الدقة 100%، يرجى لصق الـ CSS القديم الخاص بك */
        body { margin: 0; background-color: #010409; color: white; font-family: sans-serif; }
        .hero { background: url('https://mohammedhasan0.netlify.app/img/hero-bg.jpg') no-repeat center/cover; padding: 100px 20px; text-align: center; position: relative; }
        .hero::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); }
        .hero-content { position: relative; z-index: 1; }
        .hero h1 { font-size: 3rem; color: #38bdf8; margin: 0; }
        .hero p { font-size: 1.2rem; color: #94a3b8; }
        /* ... باقي تصميم صفحتك الفخم (الأزرار، البطاقات، المجلدات، المقالات)... */
        /* يرجى التأكد من استبدال هذا الجزء بكود الـ CSS القديم الخاص بك للحصول على الشكل النهائي المطابق للصورة */
    </style>
    <!-- هذا هو السطر البرمجي الوحيد الضروري لربط لوحة التحكم -->
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</head>
<body>
    <!-- هذا هو كود الـ HTML الخاص بصفحتك القديمة والكاملة (كما في image_14.png) -->
    <!-- يرجى لصق كود الـ HTML القديم الكامل هنا للحصول على جميع الأقسام (Header, Hero, Cards, Footer) -->
    
    <div class="hero">
        <div class="hero-content">
            <h1>Mohammed Hasan</h1>
            <p>تعلم . استكشف . طوّر</p>
            <p>"Knowledge is the only thing that grows when you share it."</p>
        </div>
    </div>
    
    <!-- باقي أقسام الموقع (Articles, Resources, Courses)... -->

    <!-- هذا السطر البرمجي ضروري للتعرف على لوحة التحكم عند الدخول إليها -->
    <script>
      if (window.netlifyIdentity) {
        window.netlifyIdentity.on("init", user => {
          if (!user) {
            window.netlifyIdentity.on("login", () => {
              document.location.href = "/admin/";
            });
          }
        });
      }
    </script>
</body>
</html>
