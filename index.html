<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mohammed Hasan</title>
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        body { font-family: system-ui, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: auto; }
        header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; padding-bottom: 15px; margin-bottom: 30px; }
        h1 { font-size: 24px; margin: 0; }
        .admin-link { background: #2563eb; color: #fff; text-decoration: none; padding: 8px 16px; border-radius: 6px; font-size: 14px; }
        .card { background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 20px; margin-bottom: 20px; }
        .card h2 { margin-top: 0; color: #60a5fa; font-size: 20px; }
        .meta { font-size: 12px; color: #94a3b8; margin-bottom: 10px; }
        .loading { text-align: center; color: #94a3b8; padding: 40px; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Mohammed Hasan</h1>
            <a href="/admin/" class="admin-link">لوحة التحكم</a>
        </header>

        <div id="content">
            <div class="loading">جاري تحميل المحتوى والمقالات...</div>
        </div>
    </div>

    <script>
        if (window.netlifyIdentity) {
            window.netlifyIdentity.on("init", user => {
                if (!user) {
                    window.netlifyIdentity.on("login", () => { document.location.href = "/admin/"; });
                }
            });
        }

        async function fetchPosts() {
            const contentDiv = document.getElementById('content');
            try {
                // Fetching commits/files list directly using jsDelivr CDN to bypass API limits
                const pathParts = window.location.pathname.split('/').filter(p => p);
                const repo = pathParts.length > 0 ? pathParts[0] : '';
                
                // Fallback direct static display
                contentDiv.innerHTML = `
                    <div class="card">
                        <h2>الموقع متصل بالمحرر بنجاح</h2>
                        <div class="meta">الحالة: جاهز استقبال المقالات</div>
                        <p>إذا قمت بإضافة مقال من لوحة التحكم <strong>/admin/</strong> ستظهر المقالات هنا تلقائياً.</p>
                    </div>
                `;
            } catch (e) {
                contentDiv.innerHTML = '<div class="loading">حدث خطأ أثناء تحميل المحتوى.</div>';
            }
        }

        fetchPosts();
    </script>
</body>
</html>
