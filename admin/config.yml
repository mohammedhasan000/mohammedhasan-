backend:
  name: git-gateway
  branch: main

media_folder: "img/uploads"
public_folder: "/img/uploads"

collections:
  # قسم المقالات
  - name: "articles"
    label: "المقالات (Articles)"
    folder: "content/articles"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "العنوان بالعربية", name: "title_ar", widget: "string" }
      - { label: "Title in English", name: "title_en", widget: "string" }
      - { label: "تاريخ النشر", name: "date", widget: "datetime" }
      - { label: "صورة المقال", name: "image", widget: "image", required: false }
      - { label: "المحتوى", name: "body", widget: "markdown" }

  # قسم البحوث
  - name: "researches"
    label: "البحوث (Researches)"
    folder: "content/researches"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "عنوان البحث بالعربية", name: "title_ar", widget: "string" }
      - { label: "Research Title in English", name: "title_en", widget: "string" }
      - { label: "اسم الباحث / الكاتب", name: "author", widget: "string" }
      - { label: "تاريخ النشر / السنة", name: "date", widget: "datetime" }
      - { label: "ملخص البحث (Abstract)", name: "description", widget: "string" }
      - { label: "رابط ملف البحث (PDF / External Link)", name: "link", widget: "string", required: false }
      - { label: "تفاصيل / نص البحث", name: "body", widget: "markdown", required: false }

  # قسم مصادر الدراسة
  - name: "resources"
    label: "مصادر الدراسة (Resources)"
    folder: "content/resources"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "اسم المصدر", name: "title", widget: "string" }
      - { label: "وصف قصير / اسم المؤلف", name: "description", widget: "string" }
      - { label: "رابط التحميل أو المعاينة", name: "link", widget: "string" }
      - { label: "نوع المصدر", name: "type", widget: "select", options: ["PDF", "Website", "Drive", "Other"] }

  # قسم الكورسات
  - name: "courses"
    label: "الكورسات (Courses)"
    folder: "content/courses"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "عنوان الكورس", name: "title", widget: "string" }
      - { label: "جهة تقديم الكورس / التقييم", name: "provider", widget: "string" }
      - { label: "صورة الكورس", name: "image", widget: "image", required: false }
      - { label: "رابط بدء الكورس", name: "link", widget: "string" }

  # قسم الروابط المفيدة
  - name: "links"
    label: "روابط مفيدة (Links)"
    folder: "content/links"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "اسم الموقع / الرابط", name: "title", widget: "string" }
      - { label: "وصف موجز", name: "description", widget: "string" }
      - { label: "الرابط (URL)", name: "url", widget: "string" }
